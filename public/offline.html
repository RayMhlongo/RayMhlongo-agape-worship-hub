<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agape Worship Hub Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f7f3;
        color: #111;
        font-family: Arial, sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 999px;
      }
      h1 {
        font-size: 32px;
        line-height: 1;
      }
      p {
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/agape-logo.jpeg" alt="Agape logo" />
      <h1>Offline mode</h1>
      <p>Schedules, songs, setlists, and team data are cached for service moments where the internet is unstable.</p>
    </main>
  </body>
</html>
